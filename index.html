<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Peptide Protocol Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.7);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
        }

        .version-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: #93c5fd;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 10;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 40px 0 20px;
        }

        header h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 8px;
        }

        header p {
            font-size: 14px;
            color: #cbd5e1;
            margin: 0;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
        }

        .form-panel {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            padding: 24px;
            height: fit-content;
            position: sticky;
            top: 20px;
            backdrop-filter: blur(10px);
        }

        .form-section {
            margin-bottom: 24px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .form-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin: 0 0 12px;
            display: block;
        }

        .field {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.6);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 6px;
            border: 1px solid rgba(71, 85, 105, 0.3);
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            flex: 1;
        }

        .btn {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid;
            transition: all 0.2s;
            text-align: center;
            cursor: pointer;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
            margin-bottom: 8px;
        }

        .btn-primary:hover {
            background: #2563eb;
            border-color: #2563eb;
        }

        .btn-secondary {
            background: transparent;
            color: #93c5fd;
            border-color: #3b82f6;
        }

        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .results-panel {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            padding: 24px;
            backdrop-filter: blur(10px);
            color: #e2e8f0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state-text {
            font-size: 14px;
            line-height: 1.6;
        }

        .peptide-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .peptide-card:hover {
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.8);
        }

        .peptide-card.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
        }

        .peptide-category {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 8px;
        }

        .peptide-name {
            font-size: 14px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        .peptide-mechanism {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .peptide-benefits {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .peptide-dosing {
            font-size: 11px;
            color: #64748b;
            font-style: italic;
            padding-top: 8px;
            border-top: 1px solid rgba(71, 85, 105, 0.3);
        }

        .selected-items {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
            max-height: 150px;
            overflow-y: auto;
        }

        .selected-item {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: #93c5fd;
            padding: 6px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #93c5fd;
            cursor: pointer;
            font-size: 12px;
        }

        .remove-btn:hover {
            color: #ef4444;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .form-panel {
                position: static;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Clinical Peptide Protocol Builder</h1>
            <p>Comprehensive peptide database and protocol recommendations</p>
        </header>

        <div class="main-grid">
            <!-- LEFT PANEL: FORM -->
            <div class="form-panel">
                <form id="peptide-form">
                    <div class="form-section">
                        <label class="form-section-title">Patient Age</label>
                        <input type="number" id="patient-age" placeholder="Age in years" min="0" max="150">
                    </div>

                    <div class="form-section">
                        <label class="form-section-title">Symptoms/Conditions</label>
                        <div class="checkbox-group" id="symptoms-list">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <div class="form-section">
                        <label class="form-section-title">Selected Peptides</label>
                        <div class="selected-items" id="selected-peptides">
                            <p style="color: #64748b; font-size: 12px; margin: 0;">None selected</p>
                        </div>
                    </div>

                    <div class="form-section">
                        <button type="submit" class="btn btn-primary">Generate Protocol</button>
                        <button type="reset" class="btn btn-secondary">Clear All</button>
                    </div>
                </form>
            </div>

            <!-- RIGHT PANEL: RESULTS -->
            <div class="results-panel">
                <div id="empty-state" class="empty-state">
                    <div class="empty-state-icon">💊</div>
                    <p class="empty-state-text">
                        Select symptoms and peptides to generate a personalized protocol.
                    </p>
                </div>

                <div id="results-content" style="display: none;">
                    <!-- Results will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <div class="version-badge">
        <span class="font-semibold">v1.0.0</span>
        <br>
        <span class="text-xs opacity-75">Peptide Builder</span>
    </div>

    <script>
        const app = {
            state: {
                patientAge: '',
                selectedSymptoms: [],
                selectedPeptides: []
            },

            symptoms: [
                'Aging/Anti-aging',
                'Cognitive decline',
                'Fatigue/Low energy',
                'Poor wound healing',
                'Joint pain',
                'Weight management',
                'Sexual dysfunction',
                'Muscle loss',
                'Inflammation',
                'Neurodegeneration'
            ],

            peptideDatabase: {
                senolytic: [
                    { name: 'Dasatinib', mechanism: 'Tyrosine kinase inhibitor → apoptosis of senescent cells', benefits: ['Anti-aging', 'Tissue repair', 'Cellular regeneration'], dosing: '3-5 days monthly or quarterly', category: '🔴 Senolytic Removal' },
                    { name: 'Quercetin', mechanism: 'PI3K/AKT inhibition + antioxidant', benefits: ['Anti-inflammation', 'Antioxidant', 'Senescence support'], dosing: 'Daily or cycled with Dasatinib', category: '🔴 Senolytic Removal' },
                    { name: 'TB-500', mechanism: 'Thymosin fragment → angiogenesis & tissue repair', benefits: ['Rapid healing', 'Soft tissue repair', 'Growth factor signaling'], dosing: '2-5mg weekly x 4-8 weeks', category: '🔴 Senolytic Removal' }
                ],
                senostatic: [
                    { name: 'Metformin', mechanism: 'AMPK activation → insulin sensitivity ↑, mTOR ↓', benefits: ['Metabolic health', 'ROS reduction', 'Long-term protection'], dosing: '500-2000mg daily (divided)', category: '🟡 Senostatic Prevention' },
                    { name: 'Rapamycin', mechanism: 'mTOR inhibition → prevents geroconversion', benefits: ['Cellular quiescence', 'Longevity', 'Senescence prevention'], dosing: '1-5mg weekly (cycled)', category: '🟡 Senostatic Prevention' },
                    { name: 'Telmisartan', mechanism: 'ARB + PPAR-γ activation (caloric restriction mimetic)', benefits: ['Blood pressure', 'Metabolic benefit', 'Anti-aging'], dosing: '20-80mg daily', category: '🟡 Senostatic Prevention' }
                ],
                mitochondrial: [
                    { name: 'NAD+', mechanism: 'Direct cellular energy currency precursor', benefits: ['Mitochondrial function', 'Sirtuin activation', 'Energy production'], dosing: 'IV infusion 500-1000mg', category: '🟢 Mitochondrial Energy' },
                    { name: 'NMN', mechanism: 'NAD+ precursor → oral bioavailability', benefits: ['NAD+ replenishment', 'Metabolic health', 'Exercise response'], dosing: '250-500mg daily', category: '🟢 Mitochondrial Energy' },
                    { name: 'MOTS-C', mechanism: 'AMPK activation + insulin sensitivity → mito OXPHOS', benefits: ['Insulin sensitivity', 'Energy metabolism', 'Fat loss'], dosing: '600mcg SC 2x weekly', category: '🟢 Mitochondrial Energy' },
                    { name: 'SS-31 (Elamipretide)', mechanism: 'Mitochondrial antioxidant (cardiolipin targeting)', benefits: ['Mito protection', 'Neuro-protection', 'Cardiac benefit'], dosing: '0.5mg IV weekly', category: '🟢 Mitochondrial Energy' }
                ],
                growth: [
                    { name: 'Sermorelin', mechanism: 'GHRH → endogenous GH secretion ↑ (no suppression)', benefits: ['Fat loss', 'Lean mass', 'Recovery', 'Sleep quality'], dosing: '0.3-0.5mg SC nightly or 3-5x weekly', category: '🔵 Growth/Repair' },
                    { name: 'Tesamorelin', mechanism: 'GHRH analog → visceral fat reduction + GH axis', benefits: ['Visceral fat ↓', 'IGF-1 ↑', 'Body composition'], dosing: '2mg SC daily or 6x weekly', category: '🔵 Growth/Repair' },
                    { name: 'IGF-1 LR3', mechanism: 'Long-R3 insulin-like growth factor → anabolism', benefits: ['Muscle growth', 'Recovery', 'Joint healing'], dosing: '50-100mcg SC daily', category: '🔵 Growth/Repair' },
                    { name: 'Epitalon', mechanism: 'Telomerase activation + circadian rhythm reset', benefits: ['Telomere length', 'Sleep-wake cycle', 'Anti-aging'], dosing: '10mg SC daily x 10 days (annual)', category: '🔵 Growth/Repair' },
                    { name: 'AOD-9604', mechanism: 'GH fragment (C-terminus) → fat loss without IGF-1', benefits: ['Fat loss', 'No systemic GH effects', 'Tissue-specific'], dosing: '300-600mcg SC daily', category: '🔵 Growth/Repair' }
                ],
                neuro: [
                    { name: 'Semax', mechanism: 'ACTH-derived peptide → cognition enhancement', benefits: ['Focus', 'Learning', 'Memory', 'Mental clarity'], dosing: '1-3mg SC daily', category: '🟣 Neuro/Mood' },
                    { name: 'Selank', mechanism: 'Tuftsin analog → anxiolytic + cognitive', benefits: ['Anxiety reduction', 'Calm', 'Emotional balance'], dosing: '1-3mg SC daily', category: '🟣 Neuro/Mood' }
                ],
                sexual: [
                    { name: 'PT-141', mechanism: 'Melanocortin receptor agonist → sexual arousal', benefits: ['Libido', 'Erectile function', 'Sexual satisfaction'], dosing: '0.5-2mg SC 1-2h before activity', category: '🟠 Sexual/Reproductive' },
                    { name: 'Kisspeptin-10', mechanism: 'GnRH stimulation → LH/FSH (fertility preservation)', benefits: ['Fertility on TRT', 'Hormone balance', 'Testicular health'], dosing: '600mcg SC daily', category: '🟠 Sexual/Reproductive' }
                ],
                weightloss: [
                    { name: 'Retatrutide', mechanism: 'Triple GIP/GLP-1/Glucagon receptor agonist (most potent)', benefits: ['Superior weight loss', 'Enhanced metabolic improvement', 'Improved glycemic control', 'Strongest appetite suppression'], dosing: '2.4-8mg SC weekly', category: '⚫ Weight Loss' },
                    { name: 'Semaglutide', mechanism: 'GLP-1 receptor agonist → appetite suppression', benefits: ['Appetite ↓', 'Satiety', 'Weight loss'], dosing: '0.25-2.4mg SC weekly', category: '⚫ Weight Loss' },
                    { name: 'Tirzepatide', mechanism: 'Dual GLP-1 + GIP agonist (stronger than semaglutide)', benefits: ['Superior satiety', 'Metabolic improvement', 'Weight loss'], dosing: '2.5-15mg SC weekly', category: '⚫ Weight Loss' },
                    { name: 'Tesofensine', mechanism: 'Monoamine reuptake inhibition → appetite suppression + CNS enhancement', benefits: ['Appetite suppression', 'Energy increase', 'Metabolic boost'], dosing: '0.25-0.5mg daily', category: '⚫ Weight Loss' }
                ]
            },

            getAllPeptides() {
                const all = [];
                Object.values(this.peptideDatabase).forEach(category => {
                    all.push(...category);
                });
                return all;
            },

            init() {
                this.renderSymptoms();
                this.renderPeptides();
                this.setupEventListeners();
            },

            renderSymptoms() {
                const symptomsList = document.getElementById('symptoms-list');
                symptomsList.innerHTML = this.symptoms.map((symptom, i) => `
                    <div class="checkbox-item">
                        <input type="checkbox" id="symptom-${i}" value="${symptom}" class="symptom-checkbox">
                        <label for="symptom-${i}">${symptom}</label>
                    </div>
                `).join('');

                document.querySelectorAll('.symptom-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            this.state.selectedSymptoms.push(e.target.value);
                        } else {
                            this.state.selectedSymptoms = this.state.selectedSymptoms.filter(s => s !== e.target.value);
                        }
                    });
                });
            },

            renderPeptides() {
                const resultsContent = document.getElementById('results-content');
                const categories = Object.keys(this.peptideDatabase);

                let html = '';
                categories.forEach(categoryKey => {
                    const peptides = this.peptideDatabase[categoryKey];
                    const categoryName = peptides[0].category.split(' ').slice(1).join(' ');

                    html += `<h2 style="font-size: 16px; font-weight: 700; color: #93c5fd; margin-top: 24px; margin-bottom: 12px; border-bottom: 1px solid rgba(71, 85, 105, 0.5); padding-bottom: 8px;">${peptides[0].category}</h2>`;

                    peptides.forEach(peptide => {
                        html += `
                            <div class="peptide-card" data-peptide="${peptide.name}">
                                <div class="peptide-name">${peptide.name}</div>
                                <div class="peptide-mechanism">${peptide.mechanism}</div>
                                <div class="peptide-benefits"><strong>Benefits:</strong> ${peptide.benefits.join(', ')}</div>
                                <div class="peptide-dosing"><strong>Dosing:</strong> ${peptide.dosing}</div>
                            </div>
                        `;
                    });
                });

                resultsContent.innerHTML = html;

                document.querySelectorAll('.peptide-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const peptideName = card.dataset.peptide;
                        card.classList.toggle('selected');

                        if (card.classList.contains('selected')) {
                            this.state.selectedPeptides.push(peptideName);
                        } else {
                            this.state.selectedPeptides = this.state.selectedPeptides.filter(p => p !== peptideName);
                        }

                        this.updateSelectedPeptidesList();
                    });
                });
            },

            updateSelectedPeptidesList() {
                const selectedDiv = document.getElementById('selected-peptides');
                if (this.state.selectedPeptides.length === 0) {
                    selectedDiv.innerHTML = '<p style="color: #64748b; font-size: 12px; margin: 0;">None selected</p>';
                } else {
                    selectedDiv.innerHTML = this.state.selectedPeptides.map(peptide => `
                        <div class="selected-item">
                            <span>${peptide}</span>
                            <button type="button" class="remove-btn" onclick="app.removePeptide('${peptide}')">✕</button>
                        </div>
                    `).join('');
                }
            },

            removePeptide(peptideName) {
                this.state.selectedPeptides = this.state.selectedPeptides.filter(p => p !== peptideName);
                document.querySelector(`[data-peptide="${peptideName}"]`).classList.remove('selected');
                this.updateSelectedPeptidesList();
            },

            setupEventListeners() {
                document.getElementById('peptide-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.generateProtocol();
                });

                document.getElementById('patient-age').addEventListener('change', (e) => {
                    this.state.patientAge = e.target.value;
                });

                document.getElementById('peptide-form').addEventListener('reset', () => {
                    this.state.selectedSymptoms = [];
                    this.state.selectedPeptides = [];
                    this.state.patientAge = '';
                    document.querySelectorAll('.symptom-checkbox').forEach(cb => cb.checked = false);
                    document.querySelectorAll('.peptide-card').forEach(card => card.classList.remove('selected'));
                    this.updateSelectedPeptidesList();
                });
            },

            generateProtocol() {
                if (this.state.selectedPeptides.length === 0) {
                    alert('Please select at least one peptide');
                    return;
                }

                const protocol = this.buildProtocol();
                this.displayProtocol(protocol);
            },

            buildProtocol() {
                const allPeptides = this.getAllPeptides();
                const selectedData = allPeptides.filter(p => this.state.selectedPeptides.includes(p.name));

                return {
                    age: this.state.patientAge || 'Not specified',
                    symptoms: this.state.selectedSymptoms,
                    peptides: selectedData,
                    generated: new Date().toLocaleDateString()
                };
            },

            displayProtocol(protocol) {
                const resultsContent = document.getElementById('results-content');
                let html = `
                    <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(71, 85, 105, 0.5); border-radius: 8px; padding: 16px; margin-bottom: 16px;">
                        <h3 style="font-size: 14px; font-weight: 700; color: #e2e8f0; margin-top: 0;">Protocol Summary</h3>
                        <p style="font-size: 12px; color: #cbd5e1; margin: 8px 0;"><strong>Generated:</strong> ${protocol.generated}</p>
                        <p style="font-size: 12px; color: #cbd5e1; margin: 8px 0;"><strong>Patient Age:</strong> ${protocol.age}</p>
                        <p style="font-size: 12px; color: #cbd5e1; margin: 8px 0;"><strong>Symptoms:</strong> ${protocol.symptoms.length > 0 ? protocol.symptoms.join(', ') : 'Not specified'}</p>
                    </div>

                    <h3 style="font-size: 14px; font-weight: 700; color: #93c5fd; margin-bottom: 12px; border-bottom: 1px solid rgba(71, 85, 105, 0.5); padding-bottom: 8px;">Recommended Peptides</h3>
                `;

                protocol.peptides.forEach(peptide => {
                    html += `
                        <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(71, 85, 105, 0.5); border-radius: 8px; padding: 12px; margin-bottom: 12px;">
                            <div style="font-size: 13px; font-weight: 700; color: #93c5fd; margin-bottom: 6px;">${peptide.name}</div>
                            <div style="font-size: 11px; color: #cbd5e1; margin-bottom: 6px;">${peptide.mechanism}</div>
                            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;"><strong>Benefits:</strong> ${peptide.benefits.join(', ')}</div>
                            <div style="font-size: 11px; color: #64748b;"><strong>Dosing:</strong> ${peptide.dosing}</div>
                        </div>
                    `;
                });

                resultsContent.innerHTML = html;
            }
        };

        app.init();
    </script>
</body>
</html>
